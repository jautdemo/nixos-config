apiVersion: v1
kind: Namespace
metadata:
  name: intel-gpu-plugin
  labels:
    # The plugin needs hostPath mounts (/dev/dri, /sys/class/drm, the kubelet
    # device-plugin socket), which `baseline` forbids. It is not privileged and
    # drops ALL capabilities, `privileged` here buys hostPath, nothing more.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline

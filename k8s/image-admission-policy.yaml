# Registry allowlist, enforced by the apiserver itself (CEL) - no admission
# controller to install or keep alive. The list comes from cluster.json via
# regenerate, same source as cluster-healthcheck's ALLOWED_REGISTRIES,
# which stays as the drift DETECTOR for existing workloads; this blocks new
# ones.
# Audit first: violations land in the apiserver audit log. Flip
# validationActions to [Deny] once a full day shows none.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-registry-allowlist
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps", "batch", ""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets", "cronjobs", "jobs", "pods"]
  variables:
    - name: allowed
      # BEGIN registries: nix run .#regenerate-manifests overwrites this block from cluster.json
      expression: >-
        ["docker.io", "quay.io", "ghcr.io", "registry.k8s.io", "cr.step.sm"]
      # END registries
    - name: podSpec
      expression: >-
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        (has(object.spec.template) ? object.spec.template.spec : object.spec)
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.images.all(img,
          variables.allowed.exists(r,
            img.startsWith(r + "/") || (!img.contains("/") || !img.split("/")[0].contains(".")) ))
      message: "image from a registry outside the allowlist"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-registry-allowlist
spec:
  policyName: image-registry-allowlist
  validationActions: ["Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "flux-system"]

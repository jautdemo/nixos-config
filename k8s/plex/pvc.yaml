apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      # Most of this is legitimate Plex state, and the nightly maintenance churns
      # GBs through whatever headroom is left. Running this volume to zero
      # corrupts the library, so the fix for the filling-up alert is more room,
      # never a laxer threshold.
      storage: 32Gi

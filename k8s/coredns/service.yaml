# clusterIP and every kubelet's --cluster-dns flag both come from
# cluster.json kubeDns; regenerate keeps this file in step.
# The kube-prometheus-stack coreDns scrape selects k8s-app: kube-dns on 10055.
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10055"
spec:
  # BEGIN clusterip: nix run .#regenerate-manifests overwrites this block from cluster.json
  clusterIP: 10.0.0.254
  # END clusterip
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      targetPort: 10053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 10053
      protocol: TCP

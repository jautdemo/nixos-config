apiVersion: apps/v1
kind: Deployment
metadata:
  name: diun
  namespace: diun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diun
  template:
    metadata:
      labels:
        app: diun
    spec:
      serviceAccountName: diun
      containers:
        - name: diun
          image: crazymax/diun:4.33
          env:
            - name: TZ
              value: UTC
            - name: DIUN_WATCH_RUNONSTARTUP
              value: "true"
            - name: SSL_CERT_FILE
              value: /certs/root_ca.crt
            - name: DIUN_NOTIF_MAIL_USERNAME
              value: admin@homelab.invalid
            - name: DIUN_NOTIF_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-secrets
                  key: smtp-password
          volumeMounts:
            - name: config
              mountPath: /etc/diun
            - name: data
              mountPath: /data
            - name: step-ca-root
              mountPath: /certs/root_ca.crt
              subPath: ca.pem
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: diun-config
        - name: data
          persistentVolumeClaim:
            claimName: diun-data
        - name: step-ca-root
          configMap:
            name: step-ca-root

spec:
  podSelector:
    matchLabels:
      app: authelia
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 9091
          protocol: TCP
  policyTypes: [Ingress]
---

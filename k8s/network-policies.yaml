# Default deny-all ingress for all app namespaces.
# Each namespace gets: deny-all + allow-from-traefik (if ingressed).
# Cross-namespace allows are added where needed. Ingress-only: egress policy
# is a separate, unwritten work item - nothing here constrains
# outbound traffic.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: adguard
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: adguard
spec:
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  policyTypes: [Ingress]
---
# DNS: adguard needs to accept DNS from the entire cluster (LB VIP .221)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-ingress
  namespace: adguard
spec:
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 853
          protocol: TCP
        - port: 853
          protocol: UDP
        - port: 443
          protocol: TCP
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress

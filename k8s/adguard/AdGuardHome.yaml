http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: true
  address: 0.0.0.0:80
  session_ttl: 30d
users:
  - name: jdoe
    password: __ADMIN_HASH__
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: ""
theme: auto
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 20
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    # No Quad9 here, on any of its endpoints: it strips answers that resolve
    # to RFC1918 IPs, and *.plex.direct relies on exactly that (a public name
    # resolving to the server's LAN IP, so the browser gets a real cert).
    # Under load_balance one such upstream breaks Plex intermittently.
    - tls://unfiltered.adguard-dns.com
    - udp://unfiltered.adguard-dns.com
    - tcp://unfiltered.adguard-dns.com
    - https://unfiltered.adguard-dns.com/dns-query
    - h3://unfiltered.adguard-dns.com/dns-query
    - quic://unfiltered.adguard-dns.com
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - 2620:fe::10
    - 2620:fe::fe:10
  fallback_dns: []
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: true
  server_name: dnstls.homelab.invalid
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  certificate_chain: ""
  private_key: ""
  certificate_path: /certs/fullchain.pem
  private_key_path: /certs/privkey.pem
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  # 7d: the query log lives in an emptyDir that dies with the pod, so long
  # in-pod retention buys nothing and risks filling the node's disk. Durable
  # history is in Loki (30d) via the querylog-tail sidecar. This value only
  # controls what the AdGuard UI shows.
  interval: 7d
  size_memory: 1000
  enabled: true
  ignored_enabled: false
  file_enabled: true
statistics:
  dir_path: ""
  ignored: []
  interval: 1d
  enabled: true
  ignored_enabled: false

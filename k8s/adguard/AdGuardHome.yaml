dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: UTC
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    ecosia: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites:
    # BEGIN rewrites: nix run .#regenerate-manifests overwrites this block from cluster.json
    # Split-horizon DoT/DoH: LAN clients resolve dnstls to AdGuard's own VIP
    # and connect directly; external clients get the public A record
    # (brainerd, which relays 853/443 through the wg tunnel). Home devices'
    # Private DNS thus never depends on brainerd or the public record.
    - domain: dnstls.homelab.invalid
      answer: 192.168.1.221
      enabled: true
    # Internal-only admin services, resolve locally to the Traefik VIP
    # instead of leaking hostnames + LAN IPs via public DNS. These names
    # exist only here and in edenprairie dnsmasq, never in the public zone;
    # devices without a local resolver cannot reach them, intended.
    - domain: nas.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: netgearswitch.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: zyxelrepeater.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: zyxelrouter.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: zyxelswitch.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: longhorn.homelab.invalid
      answer: 192.168.1.220
      enabled: true
    - domain: edenprairie.lan
      answer: 192.168.1.193
      enabled: true
    - domain: nas.lan
      answer: 192.168.1.194
      enabled: true
    - domain: duluth.lan
      answer: 192.168.1.195
      enabled: true
    - domain: bemidji.lan
      answer: 192.168.1.196
      enabled: true
    - domain: fargo.lan
      answer: 192.168.1.197
      enabled: true
    # END rewrites
  safe_fs_patterns:
    - /opt/adguardhome/work/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []

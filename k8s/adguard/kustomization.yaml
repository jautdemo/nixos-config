apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificate.yaml
  - deployment.yaml
  - namespace.yaml
  - service.yaml

# Flux owns the seed config through this generator; repo edits are the
# only path to the cluster.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: adguard-seed-config
    namespace: adguard
    files:
      - AdGuardHome.yaml

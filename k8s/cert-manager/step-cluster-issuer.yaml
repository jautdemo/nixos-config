# step-issuer, links cert-manager to the step-ca JWK provisioner "k8s".
# Allows cert-manager Certificate resources to request certs with
# arbitrary SANs (internal hostnames, IPs) via step-ca.
apiVersion: certmanager.step.sm/v1beta1
kind: StepClusterIssuer
metadata:
  name: step-ca
spec:
  url: https://edenprairie.infra.homelab.invalid:8443
  caBundle: 
  provisioner:
    name: k8s
    kid: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef041
    passwordRef:
      namespace: cert-manager
      name: step-ca-provisioner-password
      key: password

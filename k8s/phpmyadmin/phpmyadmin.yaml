apiVersion: v1
kind: Namespace
metadata:
  name: phpmyadmin
---
apiVersion: apps/v1
# DaemonSet, not Deployment: stateless (state in MariaDB), so one per node
# keeps the UI available while any node is down.
kind: DaemonSet
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: phpmyadmin
          image: linuxserver/phpmyadmin:5.2.3
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: UTC
            - name: PUID
              value: "11000"
            - name: PGID
              value: "11000"
            - name: PMA_HOST
              value: mariadb.mariadb.svc
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  type: ClusterIP
  selector:
    app: phpmyadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: external-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pma.homelab.invalid
      secretName: phpmyadmin-tls
  rules:
    - host: pma.homelab.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phpmyadmin
                port:
                  number: 80

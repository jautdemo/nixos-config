apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-labeler
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-labeler
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-labeler
    namespace: longhorn-system
roleRef:
  kind: ClusterRole
  name: longhorn-labeler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-label-volumes
  namespace: longhorn-system
spec:
  schedule: "*/15 * * * *"
  timeZone: "UTC"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Failures included: only new failures rotate the history out, so one
      # transient failure would keep KubeJobFailed firing forever.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: longhorn-labeler
          containers:
            - name: labeler
              image: alpine/k8s:1.36.2
              command:
                - /bin/sh
                - -c
                - |
                  # For each Longhorn PVC, label the volume with namespace--pvcname (truncated to 63 chars, valid label)
                  kubectl get pvc -A -o json | \
                    jq -r '.items[] | select(.spec.storageClassName == "longhorn" or .spec.storageClassName == "longhorn-encrypted") | "\(.spec.volumeName) \("\(.metadata.namespace)--\(.metadata.name)" | .[:63] | sub("[^A-Za-z0-9]+$"; ""))"' | \
                  while read vol label; do
                    current=$(kubectl -n longhorn-system get volumes.longhorn.io "$vol" -o jsonpath='{.metadata.labels.app}' 2>/dev/null)
                    if [ "$current" != "$label" ]; then
                      kubectl -n longhorn-system label volumes.longhorn.io "$vol" app="$label" --overwrite
                      echo "labeled $vol -> $label"
                    fi
                  done
          restartPolicy: OnFailure

apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
  annotations:
    # Create once, never re-apply. This spec is runtime state: the window
    # CronJobs patch backupTargetURL open at 08:00 and blank at 10:00, and git
    # can only declare one of those, so a reconciling Flux fights them and
    # blanks the URL mid-window.
    # IfNotPresent still CREATES this on a cold rebuild, so disaster recovery
    # is unchanged. Do not use `reconcile: disabled`, which skips creation too.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  # NFS share on the NAS, sec=sys, no credential. edenprairie rclones it to
  # Proton Drive daily.
  #
  # This is the CLOSED state; backup-window-cronjob opens it 08:00-10:00.
  # Restores need it open too, outside the window they fail with "missing
  # required target parameter".
  backupTargetURL: ""
  credentialSecret: ""
  pollInterval: "0s"

# Immich's database, as a plain Deployment like mariadb. Upstream recommends
# CloudNativePG; a cluster-wide operator for one app is not worth it.
# The image is Immich's own, with vectorchord baked in for search.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data-16
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-encrypted
  resources:
    requests: { storage: 20Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          # The tag is not a version selector: postgres refuses to start
          # against a data directory written by another major, so a tag bump
          # (bots included) just breaks the database. A major move is a
          # dump-and-load migration.
          # Pick a tag whose extension builds match the running image, so a
          # major move changes one variable. 16 has them; 17 does not.
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              # The PVC mount point itself has a lost+found dir (ext4), which
              # makes postgres's initdb refuse to run ("directory exists but
              # is not empty") - use a subdirectory instead, the standard fix.
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # POSTGRES_PASSWORD only applies at initdb. Rotating the Secret
            # leaves the live role unchanged and immich-server fails to
            # authenticate against a healthy-looking postgres. ALTER the role
            # first, then update the Secret, then restart immich-server:
            #   kubectl -n immich exec <pg-pod> -- \
            #     psql -U immich -d immich -c "ALTER USER immich WITH PASSWORD '<new>';"
            # Three consumers share this key: this pod, immich-server, and
            # the immich-postgres-backup CronJob.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-postgres-data-16
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432

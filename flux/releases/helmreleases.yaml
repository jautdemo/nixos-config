apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  storageNamespace: monitoring
  # Large chart with slow-settling CRDs; ~5 minutes is normal.
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef: { kind: HelmRepository, name: prometheus-community, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  releaseName: loki
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: loki
      # Source is grafana-community, not grafana: grafana/loki 7.x+ is the
      # Grafana Enterprise Logs chart, the OSS one lives here.
      version: "18.8.0"
      sourceRef: { kind: HelmRepository, name: grafana-community, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
  # Without this loki cannot restart: it finds ring members through the
  # headless loki-memberlist Service, which only publishes Ready pods, and
  # loki is not Ready until it has joined the ring. At replicas: 1 there is no
  # other member, so loki-0 must resolve itself, cannot, and crashloops
  # forever. It survives only until something restarts it hard.
  # publishNotReadyAddresses breaks the cycle. A postRenderer because the chart
  # hardcodes that Service with no values knob (re-check on chart bumps), hence
  # `op: add` rather than `replace`. Drop this if upstream ever adds the field.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: loki-memberlist
              namespace: monitoring
            patch: |
              - op: add
                path: /spec/publishNotReadyAddresses
                value: true
---

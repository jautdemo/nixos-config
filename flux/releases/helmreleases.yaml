# kured, safe, serialised node reboots.
# No targetNamespace of its own: it lives in kube-system
# alongside the other node-level infrastructure.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
spec:
  interval: 30m
  releaseName: kured
  targetNamespace: kube-system
  storageNamespace: kube-system
  install:
    createNamespace: false
  chart:
    spec:
      chart: kured
      version: "6.1.0"
      sourceRef: { kind: HelmRepository, name: kured, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: kured-values
      valuesKey: values.yaml

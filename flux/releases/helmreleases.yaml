# The Helm releases.
#
# releaseName and storageNamespace are set explicitly on every one rather than
# left to default: helm-controller adopts an existing release by finding its
# `sh.helm.release.v1.<name>.v<n>` Secret, and a wrong storageNamespace makes
# Flux install a second copy of something like cilium alongside the running one.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef: { kind: HelmRepository, name: cilium, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
  # hubble-peer: internalTrafficPolicy Local -> Cluster. With Local a node may
  # only use its own backend, so one stale `quarantined` state, not a live
  # probe failure, has no fallback and crashloops hubble-relay for days.
  # Safe because this Service is only discovery: relay asks any agent for the
  # peer list, then dials each node's :4244 directly, and every agent returns
  # the same list. Local is a locality optimisation, not correctness.
  # A post-render patch because the chart hardcodes it with no values knob, and
  # a `kubectl patch` would be reverted by the next reconcile.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: hubble-peer
              namespace: kube-system
            patch: |
              - op: replace
                path: /spec/internalTrafficPolicy
                value: Cluster
---

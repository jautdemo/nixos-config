# The plain-manifest tree, reconciled from git every 10 minutes.
#
# Prune is on, and it is the point: a resource deleted from the repo must stop
# running. Flux only prunes objects it previously applied, tracked by its own
# inventory labels, so it cannot touch anything it does not own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Apply only: workload readiness is Prometheus's job, and a hung rollout
  # must not mark the whole tree failed.
  wait: false
  timeout: 5m
  # SOPS. The *secret*.yaml files under k8s/ are committed encrypted (values
  # only, keys stay readable so a diff still shows which secret changed).
  # kustomize-controller decrypts them in memory at apply time using the age
  # private key in the `sops-age` Secret; plaintext never lands on disk and
  # never enters git.
  decryption:
    provider: sops
    secretRef:
      name: sops-age

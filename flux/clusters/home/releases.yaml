# The Helm releases, driven by helm-controller.
#
# prune: false - deleting a HelmRelease here would uninstall the release, so a
# `git rm` of cilium or longhorn would end the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: releases
  namespace: flux-system
spec:
  interval: 30m
  path: ./flux/releases
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
